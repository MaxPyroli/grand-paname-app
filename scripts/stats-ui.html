<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Grand Paname</title>
<style>
  :root {
    --fond: #f2f5f8; --carte: #ffffff; --bord: #dde4eb; --texte: #25303b; --sous: #6b7a89;
    --accent: #3498db; --ok: #2ecc71; --alerte: #e67e22; --mal: #e74c3c; --barre: #e6edf3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0f1620; --carte: #18222f; --bord: #263445; --texte: #ddeeff; --sous: #7f9bb8; --accent: #5ab3f5; --barre: #233246; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sous); margin: 28px 0 10px; }
  .maj { color: var(--sous); font-size: 13px; }
  button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 16px; }
  .chiffre { font-size: 32px; font-weight: 700; line-height: 1.1; }
  .legende { color: var(--sous); font-size: 13px; margin-top: 4px; }
  .barres { display: grid; gap: 8px; }
  .ligne { display: grid; grid-template-columns: minmax(80px, 150px) 1fr 40px; gap: 10px; align-items: center; font-size: 14px; }
  .piste { background: var(--barre); border-radius: 6px; height: 14px; overflow: hidden; }
  .piste > div { height: 100%; background: var(--accent); border-radius: 6px; }
  .n { text-align: right; color: var(--sous); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--bord); font-variant-numeric: tabular-nums; }
  th { color: var(--sous); font-weight: 600; font-size: 12px; }
  .rouge { color: var(--mal); } .orange { color: var(--alerte); } .vert { color: var(--ok); }
  #graphe { width: 100%; height: 130px; display: block; }
  #erreur { display: none; background: #e74c3c22; border: 1px solid var(--mal); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .vide { color: var(--sous); font-style: italic; }
  .deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📊 Stats Grand Paname</h1>
    <div><span class="maj" id="maj">Chargement…</span> <button id="actualiser">Actualiser</button></div>
  </header>
  <div id="erreur"></div>

  <h2>Appareils</h2>
  <div class="legende" id="repartition" style="margin:-4px 0 10px"></div>
  <div class="grille" id="kpiAppareils"></div>
  <div class="deux" style="margin-top:12px">
    <div class="carte"><div class="legende" style="margin:0 0 10px">Versions de l'app</div><div class="barres" id="versions"></div></div>
    <div class="carte"><div class="legende" style="margin:0 0 10px">Lignes les plus suivies pour les alertes</div><div class="barres" id="lignes"></div></div>
  </div>

  <h2>Alertes trafic</h2>
  <div class="grille" id="kpiAlertes"></div>
  <div class="carte" style="margin-top:12px">
    <div class="legende" style="margin:0 0 8px">Temps écoulé entre deux passages de la surveillance (une barre par passage, 30 derniers jours)</div>
    <svg id="graphe" preserveAspectRatio="none"></svg>
  </div>
  <div class="carte" style="margin-top:12px; overflow-x:auto">
    <table id="tableAlertes"></table>
  </div>

  <h2>Notifications envoyées à la main</h2>
  <div class="carte" style="overflow-x:auto"><table id="tableEnvois"></table></div>
</main>

<script>
const CODE = '__SECRET__';
const VARIANTE = new URLSearchParams(location.search).get('variante') || 'stable';
const NOM_FILTRE = { stable: 'version stable', dev: 'version dev', toutes: 'toutes versions' }[VARIANTE] || 'version stable';
const $ = id => document.getElementById(id);
const heure = ms => new Date(ms).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function duree(ms) {
  if (ms == null) return '—';
  if (ms >= 3600000) return Math.floor(ms / 3600000) + ' h ' + String(Math.round(ms % 3600000 / 60000)).padStart(2, '0');
  return Math.max(1, Math.round(ms / 60000)) + ' min';
}
function el(tag, texte, classe) { const e = document.createElement(tag); if (texte != null) e.textContent = texte; if (classe) e.className = classe; return e; }

function kpi(conteneur, items) {
  conteneur.replaceChildren(...items.map(([valeur, legende]) => {
    const c = el('div', null, 'carte'); c.append(el('div', String(valeur), 'chiffre'), el('div', legende, 'legende')); return c;
  }));
}
function barres(conteneur, liste, vide) {
  if (!liste.length) { conteneur.replaceChildren(el('div', vide, 'vide')); return; }
  const max = Math.max(...liste.map(x => x.n));
  conteneur.replaceChildren(...liste.map(x => {
    const l = el('div', null, 'ligne'); const piste = el('div', null, 'piste'); const rempli = el('div'); rempli.style.width = (100 * x.n / max) + '%'; piste.append(rempli);
    l.append(el('span', x.nom), piste, el('span', String(x.n), 'n')); return l;
  }));
}
function tableau(table, entetes, lignes, vide) {
  if (!lignes.length) { table.replaceChildren(el('tbody')); table.firstChild.append(el('tr')); table.firstChild.firstChild.append(el('td', vide, 'vide')); return; }
  const thead = el('thead'); const tr = el('tr'); entetes.forEach(h => tr.append(el('th', h))); thead.append(tr);
  const tbody = el('tbody');
  lignes.forEach(cells => { const r = el('tr'); cells.forEach(c => r.append(typeof c === 'object' && c ? Object.assign(el('td', c.t), { className: c.c || '' }) : el('td', c))); tbody.append(r); });
  table.replaceChildren(thead, tbody);
}
function graphe(serie) {
  const svg = $('graphe'); svg.replaceChildren();
  const points = serie.filter(p => p.ecartMs != null);
  if (!points.length) return;
  const W = 1000, H = 130, max = Math.max(...points.map(p => p.ecartMs), 3600000);
  const larg = W / points.length;
  points.forEach((p, i) => {
    const h = Math.max(2, (p.ecartMs / max) * (H - 14));
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', i * larg + 1); r.setAttribute('width', Math.max(1, larg - 2)); r.setAttribute('y', H - h); r.setAttribute('height', h); r.setAttribute('rx', 2);
    r.setAttribute('fill', p.erreur ? '#e74c3c' : p.ecartMs > 3 * 3600000 ? '#e67e22' : '#2ecc71');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); t.textContent = heure(p.at) + ' — ' + duree(p.ecartMs) + ' après le précédent';
    r.append(t); svg.append(r);
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
}

function afficher(s) {
  const a = s.appareils, al = s.alertes;
  kpi($('kpiAppareils'), [
    [a.total, 'appareils enregistrés (' + NOM_FILTRE + ')'], [a.vus7j, 'vus ces 7 derniers jours'], [a.vus30j, 'vus ces 30 derniers jours'], [a.avecAlertes, 'suivent des lignes (alertes)'],
  ]);
  const r = s.repartition;
  $('repartition').textContent = 'Tous les appareils enregistrés : ' + r.stable + ' stable · ' + r.dev + ' dev · ' + r.ancien + ' sans étiquette (anciennes versions, comptés avec la stable).';
  barres($('versions'), a.parVersion, 'Aucun appareil');
  barres($('lignes'), s.lignesPopulaires.map(l => ({ nom: l.nom, n: l.n })), 'Personne ne suit de ligne pour l\'instant');
  kpi($('kpiAlertes'), [
    [al.passages, 'passages réels (30 jours)'], [al.erreurs, 'erreurs'], [al.notificationsEnvoyees, 'notifications envoyées'],
    [duree(al.ecartMoyenMs), 'écart moyen entre passages'], [duree(al.ecartMaxMs), 'écart le plus long'], [al.dernierPassage ? heure(al.dernierPassage) : '—', 'dernier passage'],
  ]);
  graphe(al.serie);
  tableau($('tableAlertes'), ['Heure', 'Depuis le précédent', 'Perturbations', 'Nouvelles', 'Envoyées', 'Remarque'],
    al.serie.slice(-15).reverse().map(p => [heure(p.at), duree(p.ecartMs), String(p.perturbations), String(p.nouvelles), String(p.envoyees),
      p.erreur ? { t: p.erreur, c: 'rouge' } : p.premier ? 'premier passage' : '']),
    'Aucun passage réel enregistré pour l\'instant : les bilans apparaissent dès que la surveillance tourne en réel.');
  tableau($('tableEnvois'), ['Date', 'Canal', 'Titre', 'Reçus / destinataires'],
    s.envois.recents.map(e => [heure(e.date), e.categorie || '', e.titre || '', `${e.livres ?? '?'} / ${e.destinataires ?? '?'}` + (e.echecs ? ` (${e.echecs} échec(s))` : '')]),
    'Aucun envoi enregistré sur cet ordinateur.');
  $('maj').textContent = 'Mis à jour à ' + new Date(s.genereA).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

async function charger() {
  $('actualiser').disabled = true; $('erreur').style.display = 'none';
  try {
    const r = await fetch('api/stats?code=' + CODE + '&variante=' + VARIANTE);
    const j = await r.json();
    if (!r.ok) throw new Error(j.erreur || 'Erreur ' + r.status);
    afficher(j);
  } catch (e) { $('erreur').textContent = 'Impossible de charger les stats : ' + e.message; $('erreur').style.display = 'block'; }
  $('actualiser').disabled = false;
}
$('actualiser').onclick = charger;
charger(); setInterval(charger, 120000);
</script>
</body>
</html>
